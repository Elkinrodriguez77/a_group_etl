name: Mercately ETL

on:
  schedule:
    # 12:00 pm Colombia (UTC-5) -> 17:00 UTC, todos los días
    - cron: '0 17 * * *'
    # 2:30 pm Colombia -> 19:30 UTC, todos los días
    - cron: '30 19 * * *'
    # 7:00 pm Colombia -> 00:00 UTC del día siguiente, todos los días
    - cron: '0 0 * * *'
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write  # necesario para el push del paso "Mantener workflow activo"

concurrency:
  group: mercately-etl  # evita dos ETL simultáneos insertando en la misma tabla
  cancel-in-progress: false

jobs:
  run-etl:
    # Versión fija: ubuntu-latest migra a Ubuntu 26 desde el 19-oct-2026
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Mercately ETL
        env:
          # Mapeo de secretos de GitHub a variables de entorno que espera el script
          # IMPORTANTE: Los nombres a la derecha ${{ secrets.NOMBRE }} deben coincidir EXACTAMENTE con tus secretos en GitHub
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python mercately_etl.py

      - name: Mantener workflow activo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep workflow alive [skip ci]"
          # Por si hubo un push mientras corría el ETL (evita rechazo non-fast-forward)
          git pull --rebase
          git push

